name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[test]'
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/test_browser.mjs
