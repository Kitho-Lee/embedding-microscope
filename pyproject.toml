[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embedding-microscope"
version = "0.2.0"
description = "Controlled perturbation experiments for text retrieval"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=1.26,<3"]

[project.optional-dependencies]
models = ["sentence-transformers>=3,<7"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "model-revisions.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
